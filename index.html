<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/e0b8a276c3.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="img/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Compras</title>
</head>
<body>
    <div class="background-blur"></div>
    <header>
        <img src="img/logo.svg" alt="logo quicklist">
    </header>
    <main>

        <div class="mensagem-alerta" style="display: none;">
            <p><strong>Você não informou nenhum item!</strong></p>
            <p class="fechar-mensagem-alerta" onclick="fecharMensagemAlerta()">X</p>
        </div>

            <section id="secao-01">
                <div id="opcao-voltar">
                    <div><i class="fa-solid fa-arrow-left"></i></div>
                    <span>Voltar</span>
                </div>
                <div id="titulo-compras">
                    <h1>Compras da semana</h1>
                </div>
            </section>
            <section id="secao-02">
                <div id="input-botaoAdicionar">
                    <input type="text" id="novo-item" placeholder="Informe o item">
                    <button type="submit" id="adicionar-item" onclick="AbrirMensagemAlerta()">Adicionar item</button>
                </div>
            </section>
            <section id="secao-03">
                <!-- os itens aparecerão aqui -->
            </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
